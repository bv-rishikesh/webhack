
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KLNCE Login</title>

    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .box {
            background: #ffffff;
            width: 320px;
            padding: 25px;
            text-align: center;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .box img {
            width: 120px;
            margin-bottom: 10px;
        }

        .box h2 {
            margin: 10px 0 20px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .box input {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 5px;
            border: 1px solid #ccc;
            font-size: 14px;
        }

        .box button {
            width: 100%;
            padding: 10px;
            margin-top: 15px;
            background-color: red;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .box button:hover {
            background-color: darkred;
        }
    </style>
</head>

<body>

    <div class="box">
        <img src="logo.png" alt="KLNCE Logo">
        <h2>KLNCE</h2>

        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">

        <button>LOGIN</button>
    </div>

</body>
</html>
